<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visual Prompt Studio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      font-family: Arial, sans-serif;
      background: #f4f1e9;
      color: #111311;
    }

    main {
      width: 100%;
      max-width: 700px;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 42px;
    }

    .description {
      margin-bottom: 35px;
      color: #666;
    }

    .menu {
      display: grid;
      gap: 16px;
    }

    .menu a,
    .disabled {
      display: block;
      padding: 24px;
      border: 1px solid #d8d4ca;
      border-radius: 18px;
      background: white;
      color: #111311;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
    }

    .menu a:hover {
      background: #b9d264;
      transform: translateY(-2px);
    }

    .disabled {
      color: #999;
      background: #eee;
    }

    small {
      display: block;
      margin-top: 8px;
      font-size: 13px;
      font-weight: normal;
    }
  </style>
</head>

<body>
  <main>
    <h1>Visual Prompt Studio</h1>
    <p class="description">사용할 제작 도구를 선택하세요.</p>

    <div class="menu">
      <a href="./prompt-generator/">
        이미지 프롬프트 생성기 V2.0
        <small>아이디어와 참고 자료를 이미지 생성 프롬프트로 변환합니다.</small>
      </a>

      <div class="disabled">
        커리큘럼 제작기
        <small>준비 중</small>
      </div>

      <div class="disabled">
        이미지 편집기
        <small>준비 중</small>
      </div>
    </div>
  </main>
</body>
</html>
